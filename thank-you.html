<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you &mdash; WarmRally</title>
<meta name="theme-color" content="#F15A22">
<link rel="icon" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/warmrally.css">
<style>
.ty{max-width:560px;margin:0 auto;padding:70px 20px;text-align:center}
.ty .m{width:84px;height:84px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:40px;margin:0 auto 22px}
.ty h1{font-size:30px;font-weight:900;margin-bottom:12px}
.ty p{color:var(--muted);font-size:17px;margin:0 0 20px}
.ty .ordernum{display:inline-block;background:var(--orange-tint);border:1px solid var(--orange-soft);border-radius:12px;padding:14px 22px;margin:0 0 24px;font-size:15px;color:var(--ink)}
.ty .ordernum b{font-size:20px;font-weight:900;color:var(--orange);letter-spacing:.5px}
.ty .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ty a.btn{display:inline-block;text-decoration:none;font-weight:800;padding:14px 28px;border-radius:40px}
.ty a.primary{background:var(--orange);color:#fff}
.ty a.ghost{background:#fff;color:var(--orange);border:2px solid var(--orange)}
</style>
</head>
<body>
<div class="ty">
  <div class="m">&#10003;</div>
  <h1>Thank you for your order!</h1>
  <p>Your WarmRally&trade; Heated Stadium Seat is on its way. A confirmation email with your receipt and tracking will arrive shortly.</p>
  <div class="ordernum" id="orderBox" hidden>Order number<br><b id="orderNum"></b></div>
  <div class="btns">
    <a class="btn ghost" id="receiptLink" href="#" target="_blank" rel="noopener" hidden>View receipt</a>
    <a class="btn primary" href="index.html">Back to WarmRally</a>
  </div>
</div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var order = p.get('order'), receipt = p.get('receipt');
    if (order) { document.getElementById('orderNum').textContent = '#' + order; document.getElementById('orderBox').hidden = false; }
    if (receipt && /^https:\/\//.test(receipt)) { var r = document.getElementById('receiptLink'); r.href = receipt; r.hidden = false; }
  })();
</script>
</body>
</html>
